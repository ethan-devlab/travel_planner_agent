{% extends "common/base.html" %}
{% load static %}

{% block title %}建立行程{% endblock %}

{% block styles %}
 <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css">
{% endblock %}

{% block content %}
<div class="create-itinerary-page">
    <h2 class="page-header">
        <i class="ri-add-box-line"></i>
        建立新的旅遊行程
    </h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-section">
            <h5 class="section-title">
                <i class="ri-information-line"></i>
                基本資訊
            </h5>
            {{ form.as_p }}
        </div>

        <div class="form-section">
            <h5 class="section-title">
                <i class="ri-map-pin-line"></i>
                地點與支出
            </h5>

            <div id="locations-container">
                <div class="location-entry" data-location-entry>
                    <div class="location-header">
                        <h6 class="location-name">
                            <i class="ri-map-pin-2-line"></i>
                            地點
                        </h6>
                        <div class="location-order-controls" aria-label="調整地點順序">
                            <button type="button" class="btn btn-outline-secondary btn-sm" data-location-move="up" onclick="moveLocation(this, 'up')" aria-label="上移地點">
                                <i class="ri-arrow-up-line"></i>
                                上移
                            </button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" data-location-move="down" onclick="moveLocation(this, 'down')" aria-label="下移地點">
                                <i class="ri-arrow-down-line"></i>
                                下移
                            </button>
                        </div>
                        <button type="button" class="btn btn-outline-danger btn-sm remove-btn" onclick="removeLocation(this)">
                            <i class="ri-close-line"></i>
                            移除
                        </button>
                    </div>

                    <div class="input-group">
                        <div class="form-group">
                            <label class="form-label" for="location_name">
                                <i class="ri-map-pin-2-line"></i>
                                地點名稱
                            </label>
                            <input type="text" name="location_name[]" class="form-control" placeholder="如：東京塔、淺草寺" id="location_name">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="travel_method">
                                <i class="ri-road-map-line"></i>
                                前往此景點的交通方式
                            </label>
                            <select name="travel_method[]" class="form-select" id="travel_method">
                                <option value="">選擇方式</option>
                                <option value="walk">步行</option>
                                <option value="car">開車</option>
                                <option value="plane">搭飛機</option>
                                <option value="boat">搭船</option>
                                <option value="hsr">搭高鐵</option>
                                <option value="train">搭火車</option>
                                <option value="bus">搭巴士</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="transport_note">
                                <i class="ri-sticky-note-line"></i>
                                交通備註
                            </label>
                            <input type="text" name="transport_note[]" class="form-control" placeholder="如：地鐵、計程車" id="transport_note">
                        </div>
                    </div>

                    <div class="location-coordinate-row">
                        <div class="form-group">
                            <label class="form-label" for="visit_date">

                                <i class="ri-calendar-line"></i>
                                造訪日期
                            </label>
                            <input type="datetime-local" name="visit_date[]" class="form-control" id="visit_date">
                        </div>
                        <input type="hidden" name="location_latitude[]" value="">
                        <input type="hidden" name="location_longitude[]" value="">
                        <input type="hidden" name="route_order[]" value="0">
                    </div>

                    <div class="expense-list">
                        <div class="expense-header">
                            <h6 class="expenses-title">
                                <i class="ri-wallet-3-line"></i>
                                支出記錄
                            </h6>
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="addExpense(this)">
                                <i class="ri-add-line"></i>
                                新增支出
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-outline-secondary" onclick="addLocation()">
                <i class="ri-add-circle-line"></i>
                新增地點
            </button>
        </div>

        <div class="route-section" data-route-editor data-routing-service-url="{{ routing_service_url|default:'' }}" data-routing-profile="{{ routing_profile|default:'driving' }}">
            <h5 class="section-title">
                <i class="ri-route-line"></i>
                旅遊路線
            </h5>
            <div class="route-map" data-route-map></div>
            <div class="route-message" data-route-message hidden></div>
        </div>

        <div class="form-section">
            <h5 class="section-title">
                <i class="ri-calendar-check-line"></i>
                行事曆同步
            </h5>
            <div class="form-check">
                <input type="checkbox" name="sync_to_calendar" class="form-check-input" id="sync_to_calendar">
                <label class="form-check-label" for="sync_to_calendar">
                    建立行程時同步新增到行事曆
                </label>
            </div>
            <p class="form-text">只有狀態為 ongoing 的行程會同步；若地點有造訪日期，會建立對應的行事曆事件。</p>
        </div>

        <div class="submit-section">
            <button type="submit" class="btn btn-primary">
                <i class="ri-save-line"></i>
                建立行程
            </button>
        </div>
    </form>
</div>

 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
<script src="{% static 'itinerary/js/route_editor.js' %}" defer></script>
{% endblock content %}
